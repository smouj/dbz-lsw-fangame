name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Portable Stage physical contract: uses the committed Bank $61 core,
      # including the memberSlot1 final-B $39 finisher and defender WAIT_FRAME reactions.
      - name: Verify ROM Stage physical bindings
        run: npx tsx scripts/verify-rom-stage-physical-binding.ts

      # Portable STANDARD_DAMAGE result choreography ($2F/$30/$31).
      - name: Verify ROM standard-damage result physicals
        run: npx tsx scripts/verify-rom-standard-damage-result-physical.ts

      # Portable suite only: typecheck + vitest + build + every verify:* and
      # audit:* that reads committed data (no raw ROM, no outside-repo decomp).
      # ROM-dependent verifiers live in `npm run verify:rom-local` and CANNOT
      # run here (the .gbc + decomp live outside the repository).
      - name: Portable verification suite (verify:ci)
        run: npm run verify:ci
