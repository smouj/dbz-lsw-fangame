name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # devSnapshot imports this generated portable contract at compile time.
      # Materialize it before typecheck so a clean checkout is reproducible.
      # This builder consumes committed ROM-FX corpus/film data only; it does
      # not require the private/raw .gbc or the outside-repo decomp.
      - name: Materialize portable ROM-FX runtime contract
        run: npm run build:rom-fx-runtime-cutover

      # Portable suite only: typecheck + vitest + build + every verify:* and
      # audit:* that reads committed data (no raw ROM, no outside-repo decomp).
      # ROM-dependent verifiers live in `npm run verify:rom-local` and CANNOT
      # run here (the .gbc + decomp live outside the repository).
      - name: Portable verification suite (verify:ci)
        run: npm run verify:ci
